[general]
import = ["appearance.toml"]

[font]
size = 13.0

# Start in tmux, attaching to "main" if it already exists. Plain shell: alacritty -e zsh
# GUI launches on macOS may omit Homebrew's bin directory from PATH.
[terminal.shell]
program = "/bin/sh"
args = ["-c", 'PATH="$PATH:/opt/homebrew/bin:/usr/local/bin" exec tmux new-session -A -s main']
