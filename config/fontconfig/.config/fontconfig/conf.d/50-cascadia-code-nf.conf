<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Grayscale anti-aliasing for Cascadia Code NF, Alacritty's font. Alacritty takes AA from
  fontconfig, and with the system's RGB subpixel AA its strokes come out thin with orange
  and blue fringes. kitty never uses subpixel AA, which is a large part of why it looks better.
-->
<fontconfig>
  <match target="font">
    <test name="family" qual="any">
      <string>Cascadia Code NF</string>
    </test>
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
  </match>
</fontconfig>
