# tmux 3.4. Usually runs inside Alacritty (config/alacritty), which starts it on launch.

# === PREFIX: Ctrl+a ===
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# === TERMINAL ===
set -g default-terminal "tmux-256color"
# What the outer terminal can do. Alacritty sets TERM=alacritty when that terminfo entry is
# installed and xterm-256color otherwise (kitty's terminfo already declares all of this).
# RGB: truecolor. usstyle: undercurl and colored underlines (nvim diagnostics).
# sync: tmux wraps each redraw in a synchronized update, so pane and window switches
# appear in one frame instead of tearing. clipboard: copy through OSC 52, no xclip.
set -as terminal-features ",alacritty*:RGB:usstyle:strikethrough:hyperlinks:sync:clipboard"
set -as terminal-features ",xterm-256color:RGB:usstyle:strikethrough:hyperlinks:sync"
set -g focus-events on
# Long enough for a reply from the terminal to arrive in one piece; with 0 the tail of a
# split reply can land in the shell as text. 10ms is the default from tmux 3.5.
set -sg escape-time 10

# === GENERAL ===
set -g history-limit 50000
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# === VIM KEYBINDS ===
set -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# C-h/j/k/l, as in config/wezterm keymaps.lua: in nvim the key goes to vim-tmux-navigator,
# which moves across splits; with no pane in that direction it goes to the program
# (C-l clears the shell); otherwise move to the next pane. The edge check is a format, so
# only moves between panes run the ps check.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if -F '#{pane_at_left}' 'send C-h' { if-shell "$is_vim" 'send C-h' 'select-pane -L' }
bind -n C-j if -F '#{pane_at_bottom}' 'send C-j' { if-shell "$is_vim" 'send C-j' 'select-pane -D' }
bind -n C-k if -F '#{pane_at_top}' 'send C-k' { if-shell "$is_vim" 'send C-k' 'select-pane -U' }
bind -n C-l if -F '#{pane_at_right}' 'send C-l' { if-shell "$is_vim" 'send C-l' 'select-pane -R' }

# === WINDOWS ===
bind C-p previous-window
bind C-n next-window

# === SPLITS ===
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# === COPY MODE ===
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# === QUICK RELOAD ===
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# === STATUS BAR ===
# Formats only, no #(shell command): a status redraw never forks a process
set -g status-position top
set -g status-style 'bg=#1E1E2E,fg=#585B70'
set -g status-left '#[fg=#CDD6F4] #S  '
set -g status-right '#[fg=#89B4FA]#{b:pane_current_path}  #[fg=#A6E3A1]#H  #[fg=#585B70]%H:%M  '
set -g status-left-length 30
set -g status-right-length 60
set -g window-status-format '#[fg=#585B70] #I:#W '
set -g window-status-current-format '#[fg=#CDD6F4,bold] #I:#W '
set -g window-status-separator ''

# === PLUGINS (TPM, installed by bootstrap.sh) ===
# With tmux.conf under ~/.config/tmux, TPM would look in ~/.config/tmux/plugins; keep
# plugins in ~/.tmux/plugins instead, outside this repository.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# -b: load plugins in the background instead of delaying server start
run -b '~/.tmux/plugins/tpm/tpm'
